packages:
  - "apps/*"
  - "packages/*"
  - "Mobile"

allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - '@nestjs/core'
  - '@firebase/util'
  - protobufjs
